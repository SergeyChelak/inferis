[package]
name = "inferis"
version = "0.1.0"
edition = "2021"
default-run = "inferis"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
engine = { path = "../engine" }
# default features pull regex (message-body patterns) and jiff (timestamps)
# in for a game log that needs neither; module filtering still works
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color"] }
log = "0.4.33"
rand = "0.10"
